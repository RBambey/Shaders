<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glimpse Before Death</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px/1.3 system-ui, sans-serif; color: #eee; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #panel { position: fixed; top: 10px; left: 10px; width: 250px; padding: 10px 12px; background: rgba(0,0,0,.6);
           border-radius: 8px; backdrop-filter: blur(6px); max-height: calc(100% - 40px); overflow: auto; }
  #panel.hidden { display: none; }
  h3 { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #b9a; }
  h3:first-child { margin-top: 0; }
  label { display: grid; grid-template-columns: 1fr 42px; gap: 2px 6px; margin: 4px 0; }
  label input[type=range] { grid-column: 1 / 3; width: 100%; }
  .val { text-align: right; color: #9cf; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  #fps { color: #8f8; }
  #err { position: fixed; inset: 0; margin: 0; padding: 20px; background: #300; color: #fcc; white-space: pre-wrap; display: none; overflow: auto; }
  .hint { color: #888; margin-top: 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <div class="row"><b>Glimpse Before Death</b><span id="fps"></span></div>
  <div class="row">Output
    <select id="scale"><option value="0.5">50%</option><option value="0.75">75%</option><option value="1" selected>100%</option></select>
  </div>
  <div class="row">Tunnel buffer
    <select id="bufmode"><option value="json" selected>scene.json size</option><option value="full">full output size</option></select>
  </div>
  <div id="controls"></div>
  <h3>Fake audio</h3>
  <label>bass level <span class="val" id="v_bass">0.00</span><input type="range" id="bass" min="0" max="1" step="0.01" value="0"></label>
  <label>high level <span class="val" id="v_high">0.00</span><input type="range" id="high" min="0" max="1" step="0.01" value="0"></label>
  <div class="row"><input type="checkbox" id="beat" checked><span>fake 120 BPM kick + hats</span></div>
  <div class="hint">H hides this panel · Space pauses</div>
</div>
<pre id="err"></pre>

<script id="scene-script" type="text/plain">
/*__SCRIPT_JS__*/
</script>

<script id="main-glsl" type="x-shader/x-fragment">
/*__MAIN_GLSL__*/
</script>

<script>
// Mirrors GlimpseBeforeDeath.synScene/scene.json
const CONTROLS = /*__CONTROLS__*/;
const PASSES = /*__PASSES__*/;

// The scene's script.js (Synesthesia scripting), run the way Synesthesia does: scene uniforms are
// globals (e.g. syn_BassLevel) and setUniform(name, value) creates a float uniform for the shader.
const scriptSrc = document.getElementById('scene-script').textContent;
const SCRIPT_UNIFORMS = [...new Set([...scriptSrc.matchAll(/setUniform\(\s*["'](\w+)["']/g)].map(m => m[1]))];
const uniforms = {};
window.setUniform = (name, x) => { uniforms[name] = x; };
const sceneScript = new Function(scriptSrc +
  '\n;return { setup: typeof setup === "function" ? setup : null, update: typeof update === "function" ? update : null };')();
if (sceneScript.setup) sceneScript.setup();

const params = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
const errEl = document.getElementById('err');
function fail(msg) { errEl.textContent = msg; errEl.style.display = 'block'; document.title = 'ERROR'; throw new Error(msg); }
if (!gl) fail('WebGL2 not available');

const prelude = `#version 300 es
precision highp float;
uniform float TIME;
uniform vec2 RENDERSIZE;
uniform float syn_BassLevel;
uniform float syn_HighLevel;
uniform int PASSINDEX;
${PASSES.map(p => `uniform sampler2D ${p.TARGET};`).join('\n')}
${CONTROLS.map(c => `uniform float ${c.NAME};`).join('\n')}
${SCRIPT_UNIFORMS.map(n => `uniform float ${n};`).join('\n')}
out vec4 fragColor;
#line 1
`;
const fsSrc = prelude + document.getElementById('main-glsl').textContent + '\nvoid main() { fragColor = renderMain(); }\n';
const vsSrc = `#version 300 es
in vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail('Shader compile error (line numbers match main.glsl):\n\n' + gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) fail(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const U = n => gl.getUniformLocation(prog, n);

// ---- control sliders (URL params override defaults, e.g. ?morph=1&auto_morph=0)
const values = {};
const ctlRoot = document.getElementById('controls');
let group = null;
for (const c of CONTROLS) {
  if (c.UI_GROUP !== group) { group = c.UI_GROUP; ctlRoot.insertAdjacentHTML('beforeend', `<h3>${group}</h3>`); }
  const v = params.has(c.NAME) ? parseFloat(params.get(c.NAME)) : c.DEFAULT;
  values[c.NAME] = v;
  ctlRoot.insertAdjacentHTML('beforeend',
    `<label>${c.NAME} <span class="val" id="v_${c.NAME}">${v.toFixed(2)}</span>
     <input type="range" id="${c.NAME}" min="${c.MIN}" max="${c.MAX}" step="0.01" value="${v}"></label>`);
}
for (const c of CONTROLS) {
  document.getElementById(c.NAME).addEventListener('input', e => {
    values[c.NAME] = parseFloat(e.target.value);
    document.getElementById('v_' + c.NAME).textContent = values[c.NAME].toFixed(2);
  });
}
const audio = { bass: 0, high: 0 };
for (const k of ['bass', 'high']) {
  document.getElementById(k).addEventListener('input', e => {
    audio[k] = parseFloat(e.target.value);
    document.getElementById('v_' + k).textContent = audio[k].toFixed(2);
  });
}
const beatEl = document.getElementById('beat');
if (params.get('beat') === '0') beatEl.checked = false;

// ---- resolution
const scaleEl = document.getElementById('scale');
if (params.has('scale')) scaleEl.value = params.get('scale');
function resize() {
  const s = parseFloat(scaleEl.value) * Math.min(devicePixelRatio, 2);
  canvas.width = Math.round(innerWidth * s);
  canvas.height = Math.round(innerHeight * s);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize);
scaleEl.addEventListener('change', resize);
resize();

// ---- render passes (Synesthesia semantics: PASSINDEX i renders into PASSES[i].TARGET
// at that pass's size; the final, implicit pass renders to the screen)
const bufModeEl = document.getElementById('bufmode');
if (params.get('buf') === 'full') bufModeEl.value = 'full';
const passTargets = PASSES.map((p, i) => {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.uniform1i(U(p.TARGET), i);
  return { tex, fbo, w: 0, h: 0 };
});
function passSize(p) {
  return bufModeEl.value === 'full' ? [canvas.width, canvas.height] : [p.WIDTH, p.HEIGHT];
}
function ensureTarget(t, w, h) {
  if (t.w === w && t.h === h) return;
  gl.bindTexture(gl.TEXTURE_2D, t.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t.tex, 0);
  t.w = w; t.h = h;
}

// ---- keys
let paused = false;
addEventListener('keydown', e => {
  if (e.key === 'h' || e.key === 'H') document.getElementById('panel').classList.toggle('hidden');
  if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
});
if (params.get('ui') === '0') document.getElementById('panel').classList.add('hidden');

// ---- loop. ?t=SECONDS freezes time at that moment (sliders still update).
const fixedT = params.has('t') ? parseFloat(params.get('t')) : null;
let time = 0, last = performance.now(), frames = 0, fpsT = last;
const fpsEl = document.getElementById('fps');

function fakeAudio(t) {
  if (!beatEl.checked) return { bass: audio.bass, high: audio.high };
  const beat = t * 2.0;                                   // 120 BPM
  const kick = Math.exp(-(beat % 1) * 6.0);
  const hat = Math.exp(-((beat + 0.5) % 1) * 14.0) * 0.8;
  return { bass: Math.max(audio.bass, kick), high: Math.max(audio.high, hat) };
}

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (!paused) time += dt;
  let t = fixedT ?? time;
  const a = fakeAudio(t);
  window.syn_BassLevel = a.bass;
  window.syn_HighLevel = a.high;
  if (sceneScript.update && !paused && fixedT === null) sceneScript.update(dt);

  gl.uniform1f(U('TIME'), t);
  gl.uniform1f(U('syn_BassLevel'), a.bass);
  gl.uniform1f(U('syn_HighLevel'), a.high);
  for (const c of CONTROLS) gl.uniform1f(U(c.NAME), values[c.NAME]);
  for (const n of SCRIPT_UNIFORMS) gl.uniform1f(U(n), uniforms[n] ?? 0);

  PASSES.forEach((p, i) => {
    const [w, h] = passSize(p);
    const tgt = passTargets[i];
    ensureTarget(tgt, w, h);
    // bind every other pass's texture; leave this pass's own unit empty to avoid a feedback loop
    passTargets.forEach((o, k) => { gl.activeTexture(gl.TEXTURE0 + k); gl.bindTexture(gl.TEXTURE_2D, k === i ? null : o.tex); });
    gl.bindFramebuffer(gl.FRAMEBUFFER, tgt.fbo);
    gl.viewport(0, 0, w, h);
    gl.uniform2f(U('RENDERSIZE'), w, h);
    gl.uniform1i(U('PASSINDEX'), i);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  });
  passTargets.forEach((o, k) => { gl.activeTexture(gl.TEXTURE0 + k); gl.bindTexture(gl.TEXTURE_2D, o.tex); });
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(U('RENDERSIZE'), canvas.width, canvas.height);
  gl.uniform1i(U('PASSINDEX'), PASSES.length);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  frames++;
  if (now - fpsT > 500) {
    const bufs = PASSES.map(p => passSize(p).join('×')).join(', ');
    fpsEl.textContent = `${(frames * 1000 / (now - fpsT)).toFixed(0)} fps · out ${canvas.width}×${canvas.height} · tunnel ${bufs}`;
    frames = 0; fpsT = now;
  }
  if (bench) return;
  if (fixedT !== null) document.title = 'READY';
  requestAnimationFrame(frame);
}

// with ?t= frozen time, run the script up to that moment so its state (e.g. pulses) matches
if (fixedT !== null && sceneScript.update) {
  for (let ts = 0; ts < fixedT; ts += 1 / 60) {
    const a = fakeAudio(ts);
    window.syn_BassLevel = a.bass;
    window.syn_HighLevel = a.high;
    sceneScript.update(1 / 60);
  }
}

// ?bench=N renders N frames back-to-back and reports the average frame time in the title
const bench = params.has('bench');
if (bench) {
  const n = parseInt(params.get('bench')) || 10;
  const px = new Uint8Array(4);
  const sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  last = 0; frame(0); sync();                                  // warm-up (shader compile)
  const t0 = performance.now();
  for (let i = 1; i <= n; i++) { frame(i * 33); sync(); }
  document.title = 'BENCH ' + ((performance.now() - t0) / n).toFixed(1) + ' ms/frame';
} else {
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
