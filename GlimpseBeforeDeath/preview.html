<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glimpse Before Death</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px/1.3 system-ui, sans-serif; color: #eee; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #panel { position: fixed; top: 10px; left: 10px; width: 250px; padding: 10px 12px; background: rgba(0,0,0,.6);
           border-radius: 8px; backdrop-filter: blur(6px); max-height: calc(100% - 40px); overflow: auto; }
  #panel.hidden { display: none; }
  h3 { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #b9a; }
  h3:first-child { margin-top: 0; }
  label { display: grid; grid-template-columns: 1fr 42px; gap: 2px 6px; margin: 4px 0; }
  label input[type=range] { grid-column: 1 / 3; width: 100%; }
  .val { text-align: right; color: #9cf; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  #fps { color: #8f8; }
  #err { position: fixed; inset: 0; margin: 0; padding: 20px; background: #300; color: #fcc; white-space: pre-wrap; display: none; overflow: auto; }
  .hint { color: #888; margin-top: 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <div class="row"><b>Glimpse Before Death</b><span id="fps"></span></div>
  <div class="row">Output
    <select id="scale"><option value="0.5">50%</option><option value="0.75">75%</option><option value="1" selected>100%</option></select>
  </div>
  <div class="row">Tunnel buffer
    <select id="bufmode"><option value="json" selected>scene.json size</option><option value="full">full output size</option></select>
  </div>
  <div id="controls"></div>
  <h3>Fake audio</h3>
  <label>bass level <span class="val" id="v_bass">0.00</span><input type="range" id="bass" min="0" max="1" step="0.01" value="0"></label>
  <label>high level <span class="val" id="v_high">0.00</span><input type="range" id="high" min="0" max="1" step="0.01" value="0"></label>
  <div class="row"><input type="checkbox" id="beat" checked><span>fake 120 BPM kick + hats</span></div>
  <div class="hint">H hides this panel · Space pauses</div>
</div>
<pre id="err"></pre>

<script id="main-glsl" type="x-shader/x-fragment">
// Glimpse Before Death — raymarched twisting tunnel with growing veins. The walls rotate
// automatically through three looks (pitted clay -> fuzzy coral -> wet flesh),
// all under a drifting oil-slick sheen.
//
// Synesthesia inputs: TIME, RENDERSIZE, syn_BassLevel, syn_HighLevel, syn_BassTime
// Controls (scene.json): speed, twist, tunnel_radius, vein_density,
//   vein_growth_speed, bubbles, bubble_rate, sheen, hue_drift, hue_shift, audio_react

const float kTAU = 6.28318530718;

// Per-frame globals (set in renderTunnel)
float gT;       // time
float gTravel;  // camera z
float gBass;
float gHigh;

// Per-sample globals (written by map, read after the final map call)
float gVein;    // 0 = wall, 1 = vein
float gVeinId;
float gBubble;  // how far the nearest vein has turned into bubbles
float gContact; // distance to nearest vein (for contact shadows on the wall)
float gBump;    // coral: 0 in the crevices, 1 at polyp tips
float gRidge;   // flesh: 0 in the folds' valleys, 1 on their crests
vec3 gW;        // look weights at this point: x = clay, y = coral, z = flesh

// ---------------------------------------------------------------- noise

float vhash11(float p) {
    p = fract(p * 0.1031);
    p *= p + 33.33;
    p *= p + p;
    return fract(p);
}

float vhash21(vec2 p) {
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
}

float vhash31(vec3 p3) {
    p3 = fract(p3 * 0.1031);
    p3 += dot(p3, p3.zyx + 31.32);
    return fract((p3.x + p3.y) * p3.z);
}

float vnoise(vec3 p) {
    vec3 i = floor(p);
    vec3 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(vhash31(i),                   vhash31(i + vec3(1.0, 0.0, 0.0)), f.x),
                   mix(vhash31(i + vec3(0.0, 1.0, 0.0)), vhash31(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),
               mix(mix(vhash31(i + vec3(0.0, 0.0, 1.0)), vhash31(i + vec3(1.0, 0.0, 1.0)), f.x),
                   mix(vhash31(i + vec3(0.0, 1.0, 1.0)), vhash31(i + vec3(1.0, 1.0, 1.0)), f.x), f.y), f.z);
}

float smin(float a, float b, float k) {
    float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
    return mix(b, a, h) - k * h * (1.0 - h);
}

vec3 hueRotate(vec3 c, float a) {
    // Rodrigues rotation around the grey axis
    const vec3 k = vec3(0.57735);
    float ca = cos(a);
    return c * ca + cross(k, c) * sin(a) + k * dot(k, c) * (1.0 - ca);
}

// ---------------------------------------------------------------- tunnel

vec2 tunnelPath(float z) {
    return twist * vec2(2.2 * sin(z * 0.13) + 1.3 * sin(z * 0.057 + 1.7),
                        1.7 * cos(z * 0.097) + 1.5 * sin(z * 0.043 + 0.4));
}

// Looks cycle clay -> coral -> flesh along the tunnel (and slowly in time),
// holding each one and cross-fading into the next as you fly into it.
vec3 lookWeights(float z) {
    float u = z * 0.02 + gT * 0.01;
    float k = mod(floor(u), 3.0);
    float b = smoothstep(0.65, 1.0, fract(u));
    vec3 cur = vec3(k < 0.5 ? 1.0 : 0.0, abs(k - 1.0) < 0.5 ? 1.0 : 0.0, k > 1.5 ? 1.0 : 0.0);
    return mix(cur, cur.zxy, b);
}

// Pitted, domain-warped clay. sp = point projected onto the tunnel cylinder.
float clayDisp(vec3 sp) {
    vec3 w = sp * 0.9 + vec3(0.0, 0.0, gT * 0.05);
    w += vnoise(w * 1.1) * 1.2;
    float base = vnoise(w) * 0.6 + vnoise(w * 2.1) * 0.3;
    float pits = smoothstep(0.5, 0.75, vnoise(sp * 2.6 + 11.0));
    float lod = 1.0 - smoothstep(4.0, 12.0, abs(sp.z - gTravel));
    float grain = lod > 0.0 ? vnoise(sp * 6.0) * 0.05 * lod : 0.0;
    return base * 0.35 - pits * 0.22 + grain;
}

// Rows of fuzzy rounded bumps.
float coralDisp(float a, float z, vec3 sp) {
    const float N = 28.0;
    vec2 g = vec2(a / kTAU * N, z / 0.32);
    g.x += 0.5 * mod(floor(g.y), 2.0);
    vec2 id = floor(g);
    vec2 f = fract(g) - 0.5;
    float h = vhash21(vec2(mod(id.x, N), id.y));
    f += (vec2(vhash11(h * 91.7), vhash11(h * 13.3)) - 0.5) * 0.25;
    float bump = 1.0 - smoothstep(0.0, 0.5, length(f));
    float height = (0.14 + 0.16 * h) * pow(bump, 0.4);   // blunt polyp fingers
    float rings = 0.08 * sin(z * 2.2 - gT * 0.5);
    float fuzz = vnoise(sp * 9.0 + gT * 0.3) * 0.04;

    // fine surface detail, faded with distance to avoid shimmer
    gBump = bump;
    float lod = 1.0 - smoothstep(4.0, 12.0, abs(z - gTravel));
    if (lod <= 0.0) return height + rings + fuzz;
    vec2 g2 = vec2(a / kTAU * N * 4.0, z / 0.08);
    g2.x += 0.5 * mod(floor(g2.y), 2.0);
    float nodules = 1.0 - smoothstep(0.15, 0.5, length(fract(g2) - 0.5));
    float pores = smoothstep(0.62, 0.78, vnoise(sp * 16.0));
    return height + rings + fuzz + lod * (nodules * 0.025 * (0.4 + bump) - pores * 0.02);
}

// Wet, folded vessel lining that squeezes with a heartbeat and peristaltic waves.
float fleshDisp(float z, vec3 sp) {
    vec3 w = vec3(sp.xy, sp.z * 0.35) * 1.4 + vec3(0.0, 0.0, gT * 0.04);
    w += vnoise(w * 0.8) * 1.5;
    float ridge = 1.0 - abs(vnoise(w) * 2.0 - 1.0);
    ridge = ridge * ridge * ridge;
    float lumps = vnoise(w * 2.3) * 0.1;
    float lod = 1.0 - smoothstep(4.0, 12.0, abs(z - gTravel));
    float wrinkles = lod > 0.0 ? (1.0 - abs(vnoise(w * 6.0) * 2.0 - 1.0)) * 0.035 * lod : 0.0;
    float wave = 0.07 * sin(z * 0.9 - gT * 2.0);
    float beat = pow(0.5 + 0.5 * sin(gT * 2.4), 6.0) + gBass * audio_react;
    gRidge = ridge;
    return 0.3 * ridge + lumps + wrinkles + wave + 0.08 * beat;
}

// One layer of writhing veins lying on the wall, growing along z and respawning.
// 0 = veins, 1 = bubbles. The change sweeps down the tunnel as a wave, each vein slightly out of step.
float bubbleAmount(float z, float h) {
    float ph = gT * bubble_rate * 0.05 + z * 0.015 + h * 0.15;
    return bubbles * smoothstep(0.35, 0.65, 0.5 + 0.5 * sin(ph * kTAU));
}

// Growth: each vein is split into segments of length L that grow from their start, then shrink away.
// Returns (position within the segment, grown tip position, fade).
const float L = 6.0;
vec3 veinSegment(float zs, float idw, float seed) {
    float seg = floor(zs / L);
    float phase = fract(gT * vein_growth_speed * 0.15 + vhash21(vec2(idw + seed * 7.0, seg)));
    float grow = smoothstep(0.0, 0.6, phase);
    float fade = 1.0 - smoothstep(0.8, 1.0, phase);
    return vec3(zs - seg * L, 0.5 + grow * (L - 1.0), fade);
}

float veinLayer(float r, float a, float z, float wallR, float N, float spiral, float seed,
                out float vid, out float vbub) {
    float s = a / kTAU * N + z * spiral;
    float idw = mod(floor(s), N);
    float h = vhash11(idw * 17.31 + seed);
    float cellW = kTAU * wallR / N;

    float wob = 0.28 * sin(z * (0.9 + 0.8 * h) + gT * (0.6 + h) + h * kTAU)
              + 0.08 * sin(z * 3.1 - gT * 1.3 + h * 20.0);
    float du = (fract(s) - 0.5 - wob) * cellW;

    float zs = z + h * L;
    vec3 sg = veinSegment(zs, idw, seed);
    float zl = sg.x;
    float tip = sg.y;
    float fade = sg.z;
    float dz = max(0.0, max(0.5 - zl, zl - tip));

    float rv = (0.035 + 0.045 * h) * fade * (1.0 + gBass * 0.8 * audio_react);
    rv *= 0.35 + 0.65 * smoothstep(0.0, 0.8, tip - zl);

    // bubbles: the tube thins away while a string of beads swells out of it, drifts off
    // the wall and flows along, then the beads shrink back into the regrowing vein
    float bub = bubbleAmount(z, h);

    // some veins arch away from the wall
    float lift = 0.25 * pow(max(0.0, sin(z * 0.7 + h * 13.0 + gT * 0.4)), 2.0) * step(0.5, h);
    float dr = r - (wallR - rv * 0.5 - lift);
    // tube radius goes slightly negative at full bubble so no zero-width line is left behind
    float d = length(vec3(du, dr, dz)) - (rv * (1.0 - bub) - 0.01 * bub);

    if (bub > 0.001) {
        const float S = 0.34;                       // bead spacing
        float laneAng = kTAU / N;
        float zb = zs - gT * 0.2;
        float bi = floor(zb / S);
        // check this bead cell and the nearer neighbour, so rays don't step into a bead
        // from the next cell over (which would land them inside it)
        float nb = fract(zb / S) < 0.5 ? -1.0 : 1.0;
        float dBeads = 1e5;
        for (int k = 0; k < 2; k++) {
            float bk = bi + (k == 0 ? 0.0 : nb);
            float hb = vhash21(vec2(idw * 3.1 + seed, bk));
            float zc = zb - (bk + 0.5) * S;         // offset from the bead centre along the vein
            float zC = z - zc;                      // bead centre
            // place the bead using the vein's path at its centre, so it stays round
            float wobC = 0.28 * sin(zC * (0.9 + 0.8 * h) + gT * (0.6 + h) + h * kTAU)
                       + 0.08 * sin(zC * 3.1 - gT * 1.3 + h * 20.0);
            float liftC = 0.25 * pow(max(0.0, sin(zC * 0.7 + h * 13.0 + gT * 0.4)), 2.0) * step(0.5, h);
            float drift = bub * (0.05 + 0.35 * hb);
            // lateral distance as true arc length at this radius (bubbles float inward, where
            // measuring along the wall would stretch them sideways)
            float duC = (fract(s) - 0.5 - wobC - zc * spiral) * laneAng * r;
            // a bead exists where the grown vein covers its centre (looked up in the centre's own segment)
            vec3 sc = veinSegment(zs - zc, idw, seed);
            float onVein = step(0.5, sc.x) * step(sc.x, sc.y);
            float rb = (0.06 + 0.08 * hb) * sc.z * onVein * (1.0 + gBass * 0.8 * audio_react);
            // stay inside this vein's lane and bead cell
            float rc = wallR - 0.14 - liftC - drift;
            rb = min(rb, min((0.5 - abs(wobC)) * laneAng * rc, 0.5 * S) - 0.01);
            rb *= smoothstep(0.0, 0.6, bub);
            float drb = r - (wallR - rb - liftC - drift);
            dBeads = min(dBeads, length(vec3(duC, drb, zc)) - rb);
        }
        d = smin(d, dBeads, 0.03);
    }

    vid = h;
    vbub = bub;
    return d;
}

float map(vec3 p) {
    vec2 q = p.xy - tunnelPath(p.z);
    float r = length(q);
    float a = atan(q.y, q.x);
    vec3 sp = vec3(q / max(r, 1e-4) * tunnel_radius, p.z);

    vec3 w = lookWeights(p.z);
    float disp = 0.0;
    gBump = 1.0;
    gRidge = 0.0;
    if (w.x > 0.001) disp += w.x * clayDisp(sp);
    if (w.y > 0.001) disp += w.y * coralDisp(a, p.z, sp);
    if (w.z > 0.001) disp += w.z * fleshDisp(p.z, sp);

    float R = tunnel_radius * (1.0 + 0.15 * sin(p.z * 0.21 + 1.0)) * (1.0 - 0.04 * gBass * audio_react);
    float wallR = R - disp;
    float dWall = wallR - r;

    // veins rest on a smoothed wall so they don't dive into every pit;
    // in coral mode they ride on top of the bumps instead of being swallowed
    float veinR = R - dot(w, vec3(0.12, 0.3, 0.16));
    float id1, id2, b1, b2;
    float v1 = veinLayer(r, a, p.z, veinR, floor(vein_density), 0.05, 1.0, id1, b1);
    float v2 = veinLayer(r, a, p.z, veinR, floor(vein_density * 0.7) + 2.0, -0.11, 5.0, id2, b2);
    float dv = smin(v1, v2, 0.04);   // overlapping bubbles / crossing veins fuse instead of seaming

    gVeinId = v1 < v2 ? id1 : id2;
    gBubble = v1 < v2 ? b1 : b2;
    gVein = clamp(0.5 + 0.5 * (dWall - dv) / 0.006, 0.0, 1.0);
    gContact = dv;
    gW = w;
    return smin(dWall, dv, 0.025);
}

vec3 calcNormal(vec3 p, float t) {
    float e = 0.0015 * (1.0 + t * 0.3);
    const vec2 k = vec2(1.0, -1.0);
    return normalize(k.xyy * map(p + k.xyy * e) + k.yyx * map(p + k.yyx * e) +
                     k.yxy * map(p + k.yxy * e) + k.xxx * map(p + k.xxx * e));
}

float calcAO(vec3 p, vec3 n) {
    float occ = 0.0;
    float w = 1.0;
    for (int i = 1; i <= 2; i++) {
        float h = 0.08 * float(i);
        occ += (h - map(p + n * h)) * w;
        w *= 0.6;
    }
    return clamp(1.0 - occ * 3.0, 0.0, 1.0);
}

// ---------------------------------------------------------------- shading

vec3 surfaceColor(vec3 sp, float t) {
    // each look's palette is only evaluated where that look is visible
    // clay: purple / teal blotches
    vec3 clayWall = vec3(0.0);
    if (gW.x > 0.001) {
        clayWall = mix(vec3(0.34, 0.06, 0.48), vec3(0.04, 0.55, 0.46),
                       smoothstep(0.35, 0.65, vnoise(sp * 0.6 + 3.0)));
        clayWall = mix(clayWall, vec3(0.75, 0.15, 0.7), 0.35 * smoothstep(0.6, 0.85, vnoise(sp * 1.3 - 5.0)));
        clayWall *= 1.0 - 0.65 * smoothstep(0.5, 0.75, vnoise(sp * 2.6 + 11.0));   // dark pit interiors
    }

    // coral: depth bands purple -> red/orange -> green, with speckles
    vec3 coralWall = vec3(0.0);
    if (gW.y > 0.001) {
        coralWall = mix(vec3(0.42, 0.12, 1.0), vec3(1.0, 0.22, 0.08), smoothstep(2.0, 5.5, t));
        coralWall = mix(coralWall, vec3(1.0, 0.55, 0.1), smoothstep(5.0, 7.5, t) * 0.6);
        coralWall = mix(coralWall, vec3(0.25, 0.85, 0.12), smoothstep(6.5, 10.0, t));
        float speck = smoothstep(0.68, 0.8, vnoise(sp * 6.0));
        float speck2 = smoothstep(0.7, 0.82, vnoise(sp * 5.0 + 9.0));
        coralWall = mix(coralWall, vec3(0.3, 1.0, 0.65), speck * 0.75);
        coralWall = mix(coralWall, vec3(1.0, 0.15, 0.2), speck2 * 0.6 * (1.0 - smoothstep(3.0, 6.0, t)));
        coralWall = mix(coralWall, coralWall * 1.6 + 0.08, smoothstep(0.7, 1.0, gBump) * 0.5);    // pale tips
        coralWall *= mix(0.3, 1.0, smoothstep(0.0, 0.6, gBump));                                 // dark crevices
        coralWall *= 1.0 - 0.45 * smoothstep(0.62, 0.78, vnoise(sp * 16.0));                     // pores
    }

    // flesh: deep crimson valleys, rosy crests, faint capillary mottling
    vec3 fleshWall = vec3(0.0);
    if (gW.z > 0.001) {
        fleshWall = mix(vec3(0.18, 0.0, 0.05), vec3(1.0, 0.38, 0.45), smoothstep(0.05, 0.7, gRidge));
        fleshWall = mix(fleshWall, vec3(0.6, 0.05, 0.35), 0.4 * smoothstep(0.55, 0.8, vnoise(sp * 3.5 + 2.0)));
    }

    // veins
    float h = gVeinId;
    // veins: colors opposite the walls on the color wheel so they pop
    vec3 clayVein = h < 0.33 ? vec3(1.0, 0.85, 0.15) : (h < 0.66 ? vec3(1.0, 0.45, 0.1) : vec3(1.0, 0.97, 0.85));   // gold / orange / cream on purple-teal
    vec3 coralVein = h < 0.5 ? vec3(0.1, 0.95, 1.0) : vec3(0.95, 1.0, 0.9);                                       // cyan / white on purple-red-green
    vec3 fleshVein = h < 0.5 ? vec3(0.1, 0.55, 1.0) : vec3(0.7, 1.0, 0.25);                                       // electric blue / lime on crimson

    vec3 wall = clayWall * gW.x + coralWall * gW.y + fleshWall * gW.z;
    vec3 vein = clayVein * gW.x + coralVein * gW.y + fleshVein * gW.z;
    return mix(wall, vein, gVein);
}

// Pass 0: the expensive raymarch, rendered into the low-res tunnelBuf (see scene.json PASSES).
vec4 renderTunnel() {
    gT = TIME;
    gBass = syn_BassLevel;
    gHigh = syn_HighLevel;
    gTravel = speed * mix(TIME, syn_BassTime, audio_react);

    // camera rides the path, looking ahead, rolling into turns
    float z = gTravel;
    vec3 ro = vec3(tunnelPath(z), z);
    vec3 ta = vec3(tunnelPath(z + 2.0), z + 2.0);
    vec3 fw = normalize(ta - ro);
    float roll = 0.3 * sin(gT * 0.11) + (tunnelPath(z + 3.0).x - tunnelPath(z).x) * 0.15;
    vec3 up = vec3(sin(roll), cos(roll), 0.0);
    vec3 rt = normalize(cross(up, fw));
    up = cross(fw, rt);

    vec2 uv = (gl_FragCoord.xy - 0.5 * RENDERSIZE) / RENDERSIZE.y;
    vec3 rd = normalize(uv.x * rt + uv.y * up + 1.1 * fw);

    float t = 0.05;
    const float kFar = 24.0;   // walls are faded to black by here anyway
    for (int i = 0; i < 72; i++) {
        float d = map(ro + rd * t);
        if (d < 0.0012 * t) break;
        // far away the fine detail is faded out, so the field is smoother and we can stride further
        t += d * mix(0.6, 0.85, smoothstep(5.0, 14.0, t));
        if (t > kFar) break;
    }
    // rays that run out of steps (grazing silhouettes) still shade as a hit
    bool hit = t < kFar;

    vec3 col = vec3(0.0);
    if (hit) {
        vec3 pos = ro + rd * t;
        vec3 n = calcNormal(pos, t);
        float ao = calcAO(pos, n);
        map(pos); // refresh material globals for this point
        float vein = gVein;
        float bub = vein * gBubble;
        vec3 w = gW;

        vec2 q = pos.xy - tunnelPath(pos.z);
        vec3 sp = vec3(normalize(q) * tunnel_radius, pos.z);
        vec3 alb = surfaceColor(sp, t);
        // dark contact shadow on the wall around each vein so they read as separate
        alb *= mix(0.25 + 0.75 * smoothstep(0.0, 0.07, gContact), 1.0, vein);

        // oil-slick thin film: interference colors from view angle + flowing thickness
        float ndv = max(dot(n, -rd), 0.0);
        float fres = pow(1.0 - ndv, 2.0);
        float film = 1.6 * (1.0 - ndv) + 1.4 * vnoise(sp * 0.7 + vec3(0.0, 0.0, gT * 0.15)) + gT * 0.05;
        vec3 iri = 0.5 + 0.5 * cos(kTAU * (film + vec3(0.0, 0.33, 0.67)));
        float tube = vein * (1.0 - gBubble);         // vein tubes keep their own colors; bubbles take the film
        alb = mix(alb, alb * 0.6 + iri * 0.65, sheen * (0.15 + 0.85 * fres) * (1.0 - 0.85 * tube));
        alb *= 1.0 - 0.75 * bub;                     // bubble bodies read as see-through

        vec3 L = normalize(ro - pos);
        float wrap = clamp((dot(n, L) + 0.4) / 1.4, 0.0, 1.0);
        float atten = 1.0 / (1.0 + 0.035 * t * t);
        float shin = mix(24.0, 80.0, w.z);                       // flesh is wet and glossy
        float spec = pow(max(dot(reflect(rd, n), L), 0.0), shin) * (mix(0.15, 0.5, vein) + 0.8 * w.z);
        float rim = pow(1.0 - ndv, 3.0);

        col = alb * (0.12 + 1.15 * wrap) * ao;
        col += alb * rim * 0.45;
        col += alb * pow(1.0 - ndv, 1.5) * 0.5 * w.y * (1.0 - vein);   // velvet sheen on coral
        col += alb * tube * 0.3;                                        // self-glow so veins read even in shadow
        col *= mix(1.0, 0.4 + 0.6 * ndv, tube);                      // darker silhouettes keep them round and outlined
        col += vec3(0.9, 0.1, 0.15) * (1.0 - gRidge) * 0.25 * w.z * ao; // blood glow in flesh folds
        col += spec * mix(vec3(1.0), iri, sheen * 0.8);
        col += bub * (iri * (0.15 + 1.4 * fres) + spec * 1.5);   // soap-film rim + glint
        col *= atten;
        col += alb * vein * gBass * 0.6 * audio_react * atten;

        // highs: sparkle on coral tips
        float sparkleAmt = gHigh * audio_react;
        if (sparkleAmt > 0.01) {
            float sparkle = pow(vnoise(sp * 14.0 + gT * 4.0), 8.0);
            col += vec3(0.8, 1.0, 0.9) * sparkle * sparkleAmt * 6.0 * (0.3 + 0.7 * w.y) * atten;
        }
    }

    // saturate, drifting hue, tone map, vignette
    float lum = dot(col, vec3(0.299, 0.587, 0.114));
    col = max(mix(vec3(lum), col, 1.25), 0.0);
    col = hueRotate(col, (hue_shift + gT * 0.02 * hue_drift) * kTAU);
    col = 1.0 - exp(-col * 1.6);
    col = pow(col, vec3(0.9));
    col *= 1.0 - 0.35 * dot(uv, uv);

    return vec4(col, 1.0);
}

// Final pass: upscale tunnelBuf to the output size, with a light unsharp mask
// to win back some of the crispness lost to the lower render resolution.
vec4 upscale() {
    vec2 texel = 1.0 / vec2(textureSize(tunnelBuf, 0));
    vec2 lo = 0.5 * texel;
    vec2 hi = 1.0 - 0.5 * texel;
    vec2 uv = clamp(gl_FragCoord.xy / RENDERSIZE, lo, hi);
    vec3 c = texture(tunnelBuf, uv).rgb;
    vec3 blur = texture(tunnelBuf, clamp(uv + vec2(texel.x, 0.0), lo, hi)).rgb
              + texture(tunnelBuf, clamp(uv - vec2(texel.x, 0.0), lo, hi)).rgb
              + texture(tunnelBuf, clamp(uv + vec2(0.0, texel.y), lo, hi)).rgb
              + texture(tunnelBuf, clamp(uv - vec2(0.0, texel.y), lo, hi)).rgb;
    c += (c - blur * 0.25) * 0.5;
    return vec4(clamp(c, 0.0, 1.0), 1.0);
}

vec4 renderMain(void) {
    if (PASSINDEX == 0) return renderTunnel();
    return upscale();
}

</script>

<script>
// Mirrors GlimpseBeforeDeath.synScene/scene.json
const CONTROLS = [{"NAME": "speed", "TYPE": "slider", "DEFAULT": 1.2, "MIN": 0.0, "MAX": 4.0, "UI_GROUP": "motion", "DESCRIPTION": "Forward flight speed down the tunnel."}, {"NAME": "twist", "TYPE": "slider", "DEFAULT": 1.0, "MIN": 0.0, "MAX": 2.0, "UI_GROUP": "motion", "DESCRIPTION": "How hard the tunnel bends and turns. 0 = straight."}, {"NAME": "tunnel_radius", "TYPE": "slider", "DEFAULT": 1.5, "MIN": 1.0, "MAX": 2.5, "UI_GROUP": "shape", "DESCRIPTION": "Width of the tunnel."}, {"NAME": "vein_density", "TYPE": "slider", "DEFAULT": 10.0, "MIN": 3.0, "MAX": 20.0, "UI_GROUP": "veins", "DESCRIPTION": "Number of veins around the tunnel wall."}, {"NAME": "vein_growth_speed", "TYPE": "slider", "DEFAULT": 1.0, "MIN": 0.0, "MAX": 4.0, "UI_GROUP": "veins", "DESCRIPTION": "How fast veins grow, shrink away and respawn."}, {"DEFAULT": 1.0, "DESCRIPTION": "How far veins turn into bubbles when the bubble wave passes. 0 = never.", "MAX": 1.0, "MIN": 0.0, "NAME": "bubbles", "TYPE": "slider", "UI_GROUP": "veins"}, {"DEFAULT": 1.0, "DESCRIPTION": "How often the veins-to-bubbles wave comes around (1 = about every 20 s).", "MAX": 4.0, "MIN": 0.0, "NAME": "bubble_rate", "TYPE": "slider", "UI_GROUP": "veins"}, {"NAME": "sheen", "TYPE": "slider", "DEFAULT": 0.6, "MIN": 0.0, "MAX": 1.0, "UI_GROUP": "look", "DESCRIPTION": "Strength of the oil-slick rainbow film over every surface."}, {"NAME": "hue_drift", "TYPE": "slider", "DEFAULT": 0.5, "MIN": 0.0, "MAX": 4.0, "UI_GROUP": "look", "DESCRIPTION": "Speed at which the whole palette rotates through hues. 0 = fixed colors."}, {"NAME": "hue_shift", "TYPE": "slider", "DEFAULT": 0.0, "MIN": 0.0, "MAX": 1.0, "UI_GROUP": "look", "DESCRIPTION": "Manual hue offset for the whole palette."}, {"NAME": "audio_react", "TYPE": "slider", "DEFAULT": 1.0, "MIN": 0.0, "MAX": 1.0, "UI_GROUP": "audio", "DESCRIPTION": "How much bass (speed surges, vein pulse, heartbeat) and highs (sparkle) drive the scene."}];
const PASSES = [{"TARGET": "tunnelBuf", "WIDTH": 960, "HEIGHT": 540, "FLOAT": true, "FILTER": "linear", "WRAP": "repeat"}];

const params = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
const errEl = document.getElementById('err');
function fail(msg) { errEl.textContent = msg; errEl.style.display = 'block'; document.title = 'ERROR'; throw new Error(msg); }
if (!gl) fail('WebGL2 not available');

const prelude = `#version 300 es
precision highp float;
uniform float TIME;
uniform vec2 RENDERSIZE;
uniform float syn_BassLevel;
uniform float syn_HighLevel;
uniform float syn_BassTime;
uniform int PASSINDEX;
${PASSES.map(p => `uniform sampler2D ${p.TARGET};`).join('\n')}
${CONTROLS.map(c => `uniform float ${c.NAME};`).join('\n')}
out vec4 fragColor;
#line 1
`;
const fsSrc = prelude + document.getElementById('main-glsl').textContent + '\nvoid main() { fragColor = renderMain(); }\n';
const vsSrc = `#version 300 es
in vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail('Shader compile error (line numbers match main.glsl):\n\n' + gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) fail(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const U = n => gl.getUniformLocation(prog, n);

// ---- control sliders (URL params override defaults, e.g. ?morph=1&auto_morph=0)
const values = {};
const ctlRoot = document.getElementById('controls');
let group = null;
for (const c of CONTROLS) {
  if (c.UI_GROUP !== group) { group = c.UI_GROUP; ctlRoot.insertAdjacentHTML('beforeend', `<h3>${group}</h3>`); }
  const v = params.has(c.NAME) ? parseFloat(params.get(c.NAME)) : c.DEFAULT;
  values[c.NAME] = v;
  ctlRoot.insertAdjacentHTML('beforeend',
    `<label>${c.NAME} <span class="val" id="v_${c.NAME}">${v.toFixed(2)}</span>
     <input type="range" id="${c.NAME}" min="${c.MIN}" max="${c.MAX}" step="0.01" value="${v}"></label>`);
}
for (const c of CONTROLS) {
  document.getElementById(c.NAME).addEventListener('input', e => {
    values[c.NAME] = parseFloat(e.target.value);
    document.getElementById('v_' + c.NAME).textContent = values[c.NAME].toFixed(2);
  });
}
const audio = { bass: 0, high: 0 };
for (const k of ['bass', 'high']) {
  document.getElementById(k).addEventListener('input', e => {
    audio[k] = parseFloat(e.target.value);
    document.getElementById('v_' + k).textContent = audio[k].toFixed(2);
  });
}
const beatEl = document.getElementById('beat');
if (params.get('beat') === '0') beatEl.checked = false;

// ---- resolution
const scaleEl = document.getElementById('scale');
if (params.has('scale')) scaleEl.value = params.get('scale');
function resize() {
  const s = parseFloat(scaleEl.value) * Math.min(devicePixelRatio, 2);
  canvas.width = Math.round(innerWidth * s);
  canvas.height = Math.round(innerHeight * s);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize);
scaleEl.addEventListener('change', resize);
resize();

// ---- render passes (Synesthesia semantics: PASSINDEX i renders into PASSES[i].TARGET
// at that pass's size; the final, implicit pass renders to the screen)
const bufModeEl = document.getElementById('bufmode');
if (params.get('buf') === 'full') bufModeEl.value = 'full';
const passTargets = PASSES.map((p, i) => {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.uniform1i(U(p.TARGET), i);
  return { tex, fbo, w: 0, h: 0 };
});
function passSize(p) {
  return bufModeEl.value === 'full' ? [canvas.width, canvas.height] : [p.WIDTH, p.HEIGHT];
}
function ensureTarget(t, w, h) {
  if (t.w === w && t.h === h) return;
  gl.bindTexture(gl.TEXTURE_2D, t.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t.tex, 0);
  t.w = w; t.h = h;
}

// ---- keys
let paused = false;
addEventListener('keydown', e => {
  if (e.key === 'h' || e.key === 'H') document.getElementById('panel').classList.toggle('hidden');
  if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
});
if (params.get('ui') === '0') document.getElementById('panel').classList.add('hidden');

// ---- loop. ?t=SECONDS freezes time at that moment (sliders still update).
const fixedT = params.has('t') ? parseFloat(params.get('t')) : null;
let time = 0, bassTime = 0, last = performance.now(), frames = 0, fpsT = last;
const fpsEl = document.getElementById('fps');

function fakeAudio(t) {
  if (!beatEl.checked) return { bass: audio.bass, high: audio.high };
  const beat = t * 2.0;                                   // 120 BPM
  const kick = Math.exp(-(beat % 1) * 6.0);
  const hat = Math.exp(-((beat + 0.5) % 1) * 14.0) * 0.8;
  return { bass: Math.max(audio.bass, kick), high: Math.max(audio.high, hat) };
}

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (!paused) time += dt;
  let t = fixedT ?? time;
  const a = fakeAudio(t);
  if (fixedT !== null) bassTime = fixedT;
  else if (!paused) bassTime += dt * (0.6 + 1.6 * a.bass);   // like syn_BassTime: runs faster on bass

  gl.uniform1f(U('TIME'), t);
  gl.uniform1f(U('syn_BassLevel'), a.bass);
  gl.uniform1f(U('syn_HighLevel'), a.high);
  gl.uniform1f(U('syn_BassTime'), bassTime);
  for (const c of CONTROLS) gl.uniform1f(U(c.NAME), values[c.NAME]);

  PASSES.forEach((p, i) => {
    const [w, h] = passSize(p);
    const tgt = passTargets[i];
    ensureTarget(tgt, w, h);
    // bind every other pass's texture; leave this pass's own unit empty to avoid a feedback loop
    passTargets.forEach((o, k) => { gl.activeTexture(gl.TEXTURE0 + k); gl.bindTexture(gl.TEXTURE_2D, k === i ? null : o.tex); });
    gl.bindFramebuffer(gl.FRAMEBUFFER, tgt.fbo);
    gl.viewport(0, 0, w, h);
    gl.uniform2f(U('RENDERSIZE'), w, h);
    gl.uniform1i(U('PASSINDEX'), i);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  });
  passTargets.forEach((o, k) => { gl.activeTexture(gl.TEXTURE0 + k); gl.bindTexture(gl.TEXTURE_2D, o.tex); });
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(U('RENDERSIZE'), canvas.width, canvas.height);
  gl.uniform1i(U('PASSINDEX'), PASSES.length);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  frames++;
  if (now - fpsT > 500) {
    const bufs = PASSES.map(p => passSize(p).join('×')).join(', ');
    fpsEl.textContent = `${(frames * 1000 / (now - fpsT)).toFixed(0)} fps · out ${canvas.width}×${canvas.height} · tunnel ${bufs}`;
    frames = 0; fpsT = now;
  }
  if (bench) return;
  if (fixedT !== null) document.title = 'READY';
  requestAnimationFrame(frame);
}

// ?bench=N renders N frames back-to-back and reports the average frame time in the title
const bench = params.has('bench');
if (bench) {
  const n = parseInt(params.get('bench')) || 10;
  const px = new Uint8Array(4);
  const sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  last = 0; frame(0); sync();                                  // warm-up (shader compile)
  const t0 = performance.now();
  for (let i = 1; i <= n; i++) { frame(i * 33); sync(); }
  document.title = 'BENCH ' + ((performance.now() - t0) / n).toFixed(1) + ' ms/frame';
} else {
  requestAnimationFrame(frame);
}
</script>
